version: "2"
sql:
  - schema: "./api/sql/schema"
    queries: "./api/sql/queries"
    engine: "postgresql"
    gen:
      go:
        out: "./api/internal/database"
        overrides:
          - db_type: "uuid"
            go_type:
              import: "uuid"
              type: "UUID"
          - db_type: "uuid"
            nullable: true
            go_type:
              import: "uuid"
              type: "UUID"
              pointer: true
          - db_type: "jsonb"
            nullable: true
            go_type:
              import: "encoding/json"
              type: "RawMessage"
              pointer: true
