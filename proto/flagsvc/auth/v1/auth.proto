syntax = "proto3";

package flagsvc.auth.v1;

import "buf/validate/validate.proto";

service AuthService {
  rpc SignUp(SignUpRequest) returns (SignUpResponse) {}
}

message SignUpRequest {
  string email = 1 [(buf.validate.field).string = {
    email: true
    max_len: 255
  }];

  string first_name = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 50
  }];

  string last_name = 3 [(buf.validate.field).string = {
    min_len: 1
    max_len: 50
  }];

  string password = 4 [(buf.validate.field).string = {
    min_len: 8
    max_len: 68
  }];
}

message SignUpResponse {}
