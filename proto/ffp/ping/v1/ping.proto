syntax = "proto3";

package ffp.ping.v1;

import "buf/validate/validate.proto";

message PingRequest {
  string message = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 255
  }];
}

message PingResponse {
  string message = 1;
}

service PingService {
  rpc Ping(PingRequest) returns (PingResponse) {}
}
