syntax = "proto3";

package ffp.flag.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";

service FlagService {
  rpc Create(CreateRequest) returns (CreateResponse) {}
  rpc Update(UpdateRequest) returns (UpdateResponse) {}
  rpc Get(GetRequest) returns (GetResponse) {}
  rpc Delete(DeleteRequest) returns (DeleteResponse) {}
  rpc List(ListRequest) returns (ListResponse) {}
  rpc Archive(ArchiveRequest) returns (ArchiveResponse) {}
  rpc Unarchive(UnarchiveRequest) returns (UnarchiveResponse) {}
}

message Flag {
  string id = 1;
  string key = 2;
  string salt = 3;
  google.protobuf.Timestamp created_at = 4;
  google.protobuf.Timestamp updated_at = 5;
  bool archived = 6;
}

message CreateRequest {
  string key = 1 [(buf.validate.field).string = {min_len: 1}];
}

message CreateResponse {
  Flag flag = 1;
}

message UpdateRequest {
  string id = 1 [(buf.validate.field).string.uuid = true];
  string key = 2 [(buf.validate.field).string = {min_len: 1}];
}

message UpdateResponse {
  Flag flag = 1;
}

message GetRequest {
  string id = 1 [(buf.validate.field).string.uuid = true];
}

message GetResponse {
  Flag flag = 1;
}

message DeleteRequest {
  string id = 1 [(buf.validate.field).string.uuid = true];
}

message DeleteResponse {
  Flag flag = 1;
}

message ListRequest {
  optional string page_token = 1 [(buf.validate.field).string.min_len = 1];
}

message ListResponse {
  repeated Flag flags = 1;
  optional string next_page_token = 2;
}

message ArchiveRequest {
  string id = 1 [(buf.validate.field).string.uuid = true];
}

message ArchiveResponse {
  Flag flag = 1;
}

message UnarchiveRequest {
  string id = 1 [(buf.validate.field).string.uuid = true];
}

message UnarchiveResponse {
  Flag flag = 1;
}
