name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine   # same image as docker-compose.yml
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: feature-flag-test
        ports:
          - 5432:5432
        # Don't start the steps until Postgres accepts connections.
        options: >-
          --health-cmd "pg_isready -U testuser -d feature-flag-test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_DB_URL: postgres://testuser:testpassword@localhost:5432/feature-flag-test?sslmode=disable
      # Every Go module in the repository, which the Go steps run in one by one.
      GO_MODULES: api evaluator gen/go sdk

    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Install sqlc
        uses: sqlc-dev/setup-sqlc@v4
        with:
          sqlc-version: '1.31.1'

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.27.2'
          # Each Go module has its own go.sum.
          cache-dependency-path: '**/go.sum'

      - name: Install Go protobuf plugins
        run: |
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.12
          go install connectrpc.com/connect/v2/cmd/protoc-gen-connect-go@v2.0.1

      - uses: bufbuild/buf-setup-action@v1
        with:
          version: latest

      - name: Generate proto code
        run: buf generate

      # The Go code is committed for the SDK's users, so it must be what the
      # protos generate.
      - name: Check generated Go code is committed
        run: |
          if [ -n "$(git status --porcelain gen/go)" ]; then
            git status --short gen/go
            echo "gen/go differs from buf generate: run make proto-gen and commit it"
            exit 1
          fi

      - name: Run sqlc generate
        run: sqlc generate

      # Pinned to a master commit: the latest release (v2.29.0) bundles
      # golang.org/x/tools v0.49.0, which can't read Go 1.27 export data.
      # Switch back to a tagged release once one ships with x/tools >= v0.52.0.
      - name: Install gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@14ef84f6feccf40be7f5092fd2db119bf3f5f836

      # ./... stops at module boundaries, so each Go module is run on its own.
      - name: Run go vet
        run: for m in $GO_MODULES; do (cd "$m" && go vet ./...) || exit 1; done

      - name: Install goose
        run: go install github.com/pressly/goose/v3/cmd/goose@v3.27.1

      - name: Migrate test database
        run: goose -dir ./api/sql/schema postgres "$TEST_DB_URL" up

      - name: Run go tests
        run: for m in $GO_MODULES; do (cd "$m" && go test ./... -cover -race) || exit 1; done

      - name: Check security
        run: for m in $GO_MODULES; do (cd "$m" && gosec -exclude-generated -exclude-dir=node_modules ./...) || exit 1; done

  style:
    name: Style
    runs-on: ubuntu-latest

    env:
      # Every Go module in the repository, which the Go steps run in one by one.
      GO_MODULES: api evaluator gen/go sdk

    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Install sqlc
        uses: sqlc-dev/setup-sqlc@v4
        with:
          sqlc-version: '1.31.1'

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.27.2'
          # Each Go module has its own go.sum.
          cache-dependency-path: '**/go.sum'

      - name: Install Go protobuf plugins
        run: |
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.12
          go install connectrpc.com/connect/v2/cmd/protoc-gen-connect-go@v2.0.1

      - uses: bufbuild/buf-setup-action@v1
        with:
          version: latest

      - name: Generate proto code
        run: buf generate

      - name: Run sqlc generate
        run: sqlc generate

      - name: Install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@latest

      - name: Check format
        run: for m in $GO_MODULES; do (cd "$m" && test -z "$(go fmt ./...)") || exit 1; done

      - name: Check linting
        run: for m in $GO_MODULES; do (cd "$m" && staticcheck ./...) || exit 1; done
